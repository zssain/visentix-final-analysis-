name: CI

# Fast sanity gate for PRs + branch pushes: backend unit tests (DB mocked) +
# frontend type-check and vitest. Targeted < 5 min.
#
# CI-vs-local SKIP GAP (see conftest.py — auto-detected, no markers to maintain):
#   * live-Supabase tests  (test_review_gate, test_training_labels, test_products,
#     test_persistence_hardening, test_schema_p1, test_embeddings, test_f002_f007,
#     test_normalization, test_org_profile, test_profile, test_f02_ingestion_foundation)
#     are SKIPPED here — they need a reachable Supabase. They run LOCALLY (full
#     suite green: 892) and must be run before merge.
#   * ML-embedding tests  (test_f004_enforcement, test_embeddings) are SKIPPED —
#     they need sentence-transformers/torch, which CI does not install (keeps the
#     backend job lean). They run locally.
# Everything else — all the F19/F20/F21 unit tests, guardrails, scoring cores,
# routers with a mocked DB — runs in CI.

on:
  push:
    branches: [main, F02-unify-classification]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Dummy creds so app.config loads and the conftest Supabase probe fails
      # (→ live tests auto-skip). No real secret is ever needed in CI.
      SUPABASE_URL: http://localhost:1
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy
      SUPABASE_ANON_KEY: ci-dummy
      SUPABASE_JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: System libs for weasyprint (PDF render tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 libffi-dev
      - name: Install Python deps (excluding sentence-transformers/torch)
        run: |
          python -m pip install --upgrade pip
          grep -ivE '^sentence-transformers' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      - name: Pytest (live + ML tests auto-skip via conftest)
        run: pytest -q -p no:cacheprovider

  frontend:
    name: frontend (tsc + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
